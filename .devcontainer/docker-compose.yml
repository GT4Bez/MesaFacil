services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mesafacil:mesafacil@db:5432/mesafacil
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesafacil
      POSTGRES_PASSWORD: mesafacil
      POSTGRES_DB: mesafacil
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesafacil -d mesafacil"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
