name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails (JS ESM, higiene e LF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bloquear arquivos TypeScript e tsconfig
        run: |
          ts_files=$(git ls-files '*.ts' '*.tsx' '*.mts' '*.cts' '*tsconfig*.json')
          if [ -n "$ts_files" ]; then
            echo "::error::Arquivos TypeScript/tsconfig não são permitidos (stack 100% JS ESM):"
            echo "$ts_files"
            exit 1
          fi
      - name: Bloquear segredos (.env) e pastas de agentes/IDE
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env($|\.(local|development|production|test)$)|(^|/)\.(claude|cursor|devin|agents)/' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Arquivos sensíveis ou resíduos de agentes não devem ser versionados:"
            echo "$forbidden"
            exit 1
          fi
      - name: Validar fim de linha LF em scripts shell (*.sh)
        run: |
          crlf=$(git ls-files -z '*.sh' | xargs -0 -r grep -Il $'\r' || true)
          if [ -n "$crlf" ]; then
            echo "::error::Scripts shell precisam usar LF (evita /bin/sh^M no Linux/Docker):"
            echo "$crlf"
            exit 1
          fi

  backend:
    name: Backend (testes unitários e de integração)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesafacil
          POSTGRES_PASSWORD: mesafacil
          POSTGRES_DB: mesafacil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesafacil -d mesafacil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mesafacil:mesafacil@localhost:5432/mesafacil_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Validar migrations e seeds SQL
        run: |
          bun -e '
            import { readdirSync, readFileSync } from "node:fs";
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.TEST_DATABASE_URL });
            await client.connect();
            await client.query("DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;");
            for (const dir of ["../sql/migrations", "../sql/seeds"]) {
              for (const file of readdirSync(dir).filter((f) => f.endsWith(".sql")).sort()) {
                await client.query(readFileSync(`${dir}/${file}`, "utf8"));
              }
            }
            await client.end();
          '

  frontend:
    name: Frontend (testes unitários e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesafacil
          POSTGRES_PASSWORD: mesafacil
          POSTGRES_DB: mesafacil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesafacil -d mesafacil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mesafacil:mesafacil@localhost:5432/mesafacil_test
      JWT_SECRET: ci-e2e-jwt-secret-key-32-chars-min
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Instalar dependências (backend + frontend)
        run: |
          (cd backend && bun install --frozen-lockfile)
          (cd frontend && bun install --frozen-lockfile)
      - name: Aplicar migrations e seeds SQL
        run: |
          cd backend && bun -e '
            import { readdirSync, readFileSync } from "node:fs";
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            for (const dir of ["../sql/migrations", "../sql/seeds"]) {
              for (const file of readdirSync(dir).filter((f) => f.endsWith(".sql")).sort()) {
                await client.query(readFileSync(`${dir}/${file}`, "utf8"));
              }
            }
            await client.end();
          '
      - name: Instalar Chromium do Playwright
        run: cd frontend && bunx playwright install chromium --with-deps
      - name: Subir API e executar suíte E2E
        run: |
          (cd backend && bun src/server.js &)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3001/menu-items; then break; fi
            sleep 1
          done
          cd frontend && bun run test:e2e
